<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste box</title>
    <style>
        
        body {
            background-color: white;
            height: 98vh;
        }

        .box {

            position: relative;
            background-color: white;
            box-shadow: 2px 2px 3px rgba(0, 0, 0, 0.158);

            margin: auto;
            
            border: 1px solid black;
            border-radius: 10px;
            
            max-width: 400px;
            min-height: 700px;
        }

        #botaobox {

            position: absolute;

            border: 1px solid black;
            border-radius: 10px;
            
            background-image: linear-gradient(to right, yellow, green);

            font-family: monospace;
            font-size: 1.6em;
            font-weight: 600;

            padding: auto;

            width: 350px;
            height: 50px;

            left: 100%;
            top: 100%;

            transition: 0.3s ease;
            transform: translate(-107%, -150%);
        }


        #botaobox:hover {
            transition: 0.3s ease;
            transform: translate(-107%, -150%) scale(0.95);
        }
    </style>
</head>
<body>
    <div class="box">
        <div>
            <button id="botaobox">CLIQUE AQUI</button>
        </div>
    </div>
</body>
</html>
